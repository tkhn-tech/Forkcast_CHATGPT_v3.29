/* Integrated Forkcast hero art + soft, atmospheric design language */
:root{--brand-soft:color-mix(in srgb,var(--brand) 12%,var(--card));--brand-text:var(--brand-strong);--cta:var(--mint);--cta-hover:color-mix(in srgb,var(--mint) 88%,#000);--cta-ink:var(--mint-ink);--muted-bg:var(--subtle)}
.app{overflow-x:clip}
.hero{position:relative;display:flex;align-items:center;gap:8px;min-height:154px;padding:18px 0 14px;margin-bottom:22px;isolation:isolate;overflow:visible}
.hero-bg{position:absolute;inset:-18px -24px -26px;z-index:-1;pointer-events:none;background:linear-gradient(165deg,var(--brand-soft) 0%,transparent 85%);mask-image:radial-gradient(ellipse 72% 76% at 50% 42%,#000 38%,transparent 100%)}
.hero-bg:before,.hero-bg:after{content:"";position:absolute;border-radius:50%;filter:blur(28px)}
.hero-bg:before{width:200px;height:200px;right:2%;top:-8%;background:var(--mint);opacity:.24}
.hero-bg:after{width:160px;height:160px;left:-2%;bottom:6%;background:var(--brand);opacity:.16}
.hero .txt{position:relative;flex:1;min-width:0;display:flex;flex-direction:column;align-items:flex-start;gap:5px}
.hero .txt .eyebrow{margin:0 0 2px}
.hero .txt .page-title{font-size:30px;line-height:1.18}
.hero .txt .lead{font-size:14px;line-height:20px;margin:3px 0 0;max-width:30ch}
.hero .art{position:relative;flex:none;width:132px;height:112px;margin-right:-6px;overflow:visible}
.art .g-bg{fill:var(--card);opacity:.5}.art .g-sh{fill:var(--brand);opacity:.16}.art .g-hl{fill:#fff;opacity:.4}.art .g-sp{fill:var(--mint);opacity:.9}.art .g-f{fill:var(--card)}
.art .g-l{fill:none;stroke:var(--brand-text);stroke-width:3.5;stroke-linecap:round;stroke-linejoin:round}.art .g-d{fill:none;stroke:var(--brand-text);stroke-width:2.5;stroke-linecap:round;stroke-dasharray:1 8;opacity:.7}.art .g-m{fill:none;stroke:var(--brand-text);stroke-width:3.5;stroke-linecap:round;opacity:.5}.art .g-o{fill:none;stroke:var(--mint);stroke-width:4;stroke-linecap:round}.art .g-sk{fill:var(--card);stroke:var(--brand-text);stroke-width:3.5;stroke-linejoin:round}.art .g-c{fill:var(--mint)}.art .g-b{fill:var(--brand)}.art .g-t{fill:var(--brand-text)}
.art *{transform-box:fill-box;transform-origin:center}.art .g-sp{animation:tw 2.6s ease-in-out infinite}.art .g-sp~.g-sp{animation-delay:.9s}.art .g-sp~.g-sp~.g-sp{animation-delay:1.7s}
@keyframes tw{0%,100%{opacity:.25;transform:scale(.6) rotate(0)}50%{opacity:1;transform:scale(1.15) rotate(20deg)}}
.art .beam{animation:beam 3s ease-in-out infinite alternate}@keyframes beam{from{transform:translateY(-30px)}to{transform:translateY(30px)}}
.art .bob{animation:bob 2.2s ease-in-out infinite alternate}@keyframes bob{from{transform:translateY(0)}to{transform:translateY(-6px)}}
.art .pin{animation:pin 1.6s ease-in-out infinite}@keyframes pin{0%,100%{transform:translateY(0)}40%{transform:translateY(-7px)}60%{transform:translateY(0)}}
.art .g-d{animation:march 2s linear infinite}@keyframes march{to{stroke-dashoffset:-9}}
.art .k1{animation:kx1 3.2s ease-in-out infinite alternate}.art .k2{animation:kx2 3.2s ease-in-out -1.6s infinite alternate}.art .k3{animation:kx3 3.2s ease-in-out -.8s infinite alternate}

function normalizeWord(w){w=w.toLowerCase();if(w.length>4&&w.endsWith('ies'))return w.slice(0,-3)+'y';if(w.length>4&&w.endsWith('oes'))return w.slice(0,-2);if(w.length>4&&/(ches|shes|sses|xes)$/.test(w))return w.slice(0,-2);if(w.length>3&&w.endsWith('s')&&!w.endsWith('ss'))return w.slice(0,-1);return w}

function dietsAllow(recipe){const p=state.preferences.diets;const text=(recipe.name+' '+recipe.ingredients.map(i=>i.name).join(' ')).toLowerCase();const any=r=>r.test(text);if(p.halal&&any(/pork|bacon|ham|lard|sausage|wine|beer|alcohol|mirin|sake/))return false;if((p.vegetarian||p.vegan)&&any(/chicken|beef|pork|lamb|meat|fish|salmon|tuna|prawn|shrimp|crab|lobster|shellfish|fishball|fish ball|shrimp paste|anchov|pork ribs/))return false;if(p.vegan&&any(/egg|milk|cheese|butter|cream|yogurt|yoghurt|dairy|honey|parmesan/))return false;if(p.lowCarb&&any(/rice|noodle|bee hoon|pasta|bread|potato|flour|congee|mee goreng|fried rice/))return false;if(p.lactoseFree&&any(/milk|cheese|butter|cream|yogurt|yoghurt|dairy|parmesan|whey/))return false;if(p.shellfishFree&&any(/prawn|shrimp|shellfish|crab|lobster|mussel|oyster|clam/))return false;if(p.nutFree&&any(/peanut|almond|cashew|walnut|pecan|pistachio|hazelnut|sesame|nut/))return false;if(p.glutenFree&&any(/wheat|barley|rye|flour|bread|pasta|egg noodles|yellow noodles|soba|soy sauce|mee goreng/))return false;const allergies=(p.otherAllergies||'').split(/[,;\n]/).map(s=>s.trim().toLowerCase()).filter(s=>s.length>1);if(allergies.some(a=>text.includes(a)))return false;const cap=state.preferences.kidFriendly?1:({0:0,1:1,2:2,3:3,4:3}[Number(state.preferences.taste.spice)]??2);if(Number(recipe.spice)>cap)return false;return true}
function recipeMatchesAsk(recipe,query){if(!query.trim())return true;const skip=new Set(['a','the','with','using','use','make','please','dinner','meal','food','recipe','and','for','my','your','some','quick','easy','minutes','min','under','kid','friendly','mild','spices','spice','light','what','in','fridge','want','suggest','suggestion','15','20','30','me','one','tonight']);let keys=tokens(query).filter(k=>!skip.has(k));if(/kid|family|child/.test(query.toLowerCase())&&!recipe.kidFriendly)return false;if(/15[- ]?min|\b15\b/.test(query.toLowerCase())&&Number(recipe.minutes)>15)return false;if(/mild|gentle/.test(query.toLowerCase())&&Number(recipe.spice)>1)return false;if(/vegetarian|vegan|plant/.test(query.toLowerCase())&&!/vegetarian/.test(recipe.category.toLowerCase())&&!recipe.ingredients.some(i=>/tofu|chickpea|lentil|tempeh|vegetable|mushroom/i.test(i.name)))return false;if(/soup|porridge|congee/.test(query.toLowerCase())&&!/soup|porridge|congee/i.test(recipe.category+' '+recipe.name))return keys.length?keys.some(k=>(recipe.name+' '+recipe.summary+' '+recipe.ingredients.map(i=>i.name).join(' ')).toLowerCase().includes(k)):true;if(!keys.length)return true;const txt=(recipe.name+' '+recipe.summary+' '+recipe.category+' '+recipe.ingredients.map(i=>i.name).join(' ')).toLowerCase();return keys.some(k=>txt.includes(k))}
function getRecipes(){let arr=[...(state.generatedRecipes||[]),...DATA.recipes].filter(dietsAllow).filter(r=>recipeMatchesAsk(r,state.recipeAsk));const byMeal=arr.filter(r=>recipeFitsMeal(r,activeMealKey()));if(byMeal.length)arr=byMeal;switch(state.recipeFilter){case'Under 15 min':arr=arr.filter(r=>r.minutes<15);break;case'Vegetarian':arr=arr.filter(r=>/vegetarian/i.test(r.category)||(!/chicken|fish|prawn|shrimp|beef|pork|meat|fishball/i.test(r.ingredients.map(i=>i.name).join(' '))));break;case'Low carb':arr=arr.filter(r=>/low carb/i.test(r.category)||! /rice|noodle|pasta|bread|potato|flour/i.test(r.ingredients.map(i=>i.name).join(' ')));break;case'Soups & porridge':arr=arr.filter(r=>/soups|porridge/i.test(r.category));break;case'Rice & noodles':arr=arr.filter(r=>/rice|noodles/i.test(r.category));break;case'Spicy':arr=arr.filter(r=>r.spice>=2);break;}return arr.sort((a,b)=>shareInFridge(b)-shareInFridge(a)||a.minutes-b.minutes)}
function routeLine(){return DATA.lines[state.route.line]||DATA.lines.EWL}
function getAlerts(){const a=[];state.items.forEach(i=>{if(i.qty<=1&&!/rice|noodle|pasta/i.test(i.name))a.push({title:i.name+' is running low',hint:i.qty+' '+i.unit+' left',tab:'fridge',icon:'🥬'});const age=ageDays(i.addedAt);if(isPerishable(i.name)&&age>=4)a.push({title:'Use '+i.name.toLowerCase()+' soon',hint:'Added '+age+' days ago',tab:'fridge',icon:'⏳'})});state.gaps.forEach(g=>a.push({title:g.name+' is on your list',hint:'For '+g.recipeName,tab:'gaps',icon:'🛒'}));return a}

function currentMealKey(){const h=new Date().getHours();return h>=5&&h<11?'breakfast':h>=11&&h<16?'lunch':h>=16&&h<22?'dinner':'supper'}
const MEAL_LABELS={breakfast:'Breakfast',lunch:'Lunch',dinner:'Dinner',supper:'Supper'};
function activeMealKey(){return state.mealChoice&&state.mealChoice!=='auto'?state.mealChoice:currentMealKey()}
function mealLabel(){return MEAL_LABELS[activeMealKey()]||'Meals'}
function recipeFitsMeal(r,key){const txt=((r.name||'')+' '+(r.category||'')+' '+(r.ingredients||[]).map(i=>i.name).join(' ')).toLowerCase();if(key==='dinner')return true;if(key==='breakfast')return /egg|toast|omelette|congee|porridge|custard|oat|bread|pancake|cereal/i.test(txt)&&!/prawn|beef|pork|fish|salmon|curry|spaghetti|sambal/i.test(txt);if(key==='lunch')return /rice|noodle|pasta|spaghetti|bee hoon|bowl|salad|soup|bread|toast|omelette|congee|porridge|tofu|vegetable/i.test(txt);return /soup|congee|porridge|toast|custard|salad|omelette|egg/i.test(txt)&&! /prawn|beef|pork|curry|sambal/i.test(txt)}
function healthReviewHtml(r){const raw=String(state.profile.healthConditions||'').toLowerCase();if(!raw.trim())return '';const n=r.nutrition||nutritionEstimate(r),flags=[];if(/diabet|blood sugar|glucose/.test(raw)){if(n.carbs>=60||n.sugar>=15)flags.push('Higher estimated carbohydrate/sugar load; review the portion and verify nutrition labels.');else flags.push('Check carbohydrate portions and sauces against your individual plan.')}if(/cholesterol|heart|cardiac/.test(raw)){const txt=(r.name+' '+r.ingredients.map(i=>i.name).join(' ')).toLowerCase();if(n.fat>=20||/cheese|cream|butter|coconut|bacon|sausage|beef|pork/i.test(txt))flags.push('Contains ingredients or estimated fat that may warrant checking saturated fat and portion size.');else flags.push('Review saturated fat and sodium on the ingredient labels.')}if(/hypertension|blood pressure|\bbp\b/.test(raw)){if(n.sodium>=800)flags.push('Higher estimated sodium; consider lower-sodium seasoning and check labels.');else flags.push('Sodium varies with sauces and seasoning; check the actual product labels.')}if(/gout|uric acid/.test(raw)&&/beef|pork|prawn|shrimp|anchov|sardine|organ/i.test(r.name+' '+r.ingredients.map(i=>i.name).join(' ')))flags.push('Some ingredients may be relevant to gout management; verify suitability with your clinician.');if(!flags.length)flags.push('Review the estimated nutrition against your personal dietary advice.');return `<div class="health-review ${flags.some(x=>/Higher|Contains|may be relevant/i.test(x))?'warn':''}"><strong>Health note · not medical advice</strong><br>${flags.map(esc).join('<br>')}<br><span class="hint">Nutrition values are estimates, not clinically verified.</span></div>`}
function recordSensorEvent(type,name,qty,unit,why){state.sensor=state.sensor||{connected:false,source:'simulated',temp:3.7,door:'Closed',events:[]};state.sensor.events=state.sensor.events||[];state.sensor.events.unshift({type,name,qty,unit,why,at:new Date().toISOString()});state.sensor.events=state.sensor.events.slice(0,12);state.sensor.lastSeen=new Date().toLocaleString();state.sensor.source='simulated'}

function applyAppearance(){const p=state.profile||{},root=document.documentElement,palette=APPEARANCE[p.themeColor]||APPEARANCE.teal,dark=p.themeMode==='dark'||(p.themeMode==='auto'&&window.matchMedia&&window.matchMedia('(prefers-color-scheme: dark)').matches),brand=palette[0],mint=palette[1];const mix=(hex,white,amt)=>{const a=hex.match(/[0-9a-f]{2}/ig)||['11','5e','59'];const b=white.match(/[0-9a-f]{2}/ig)||['ff','ff','ff'];return '#'+a.map((v,i)=>Math.round(parseInt(v,16)*(1-amt)+parseInt(b[i],16)*amt).toString(16).padStart(2,'0')).join('')};const brandText=dark?mix(brand,'#ffffff',.55):brand;const vars={ '--brand':brand,'--brand-strong':brandText,'--mint':mint,'--mint-ink':dark?'#05251a':'#082a21','--focus':mint,'--brand-soft':mix(brand,dark?'#101815':'#ffffff',.86),'--brand-text':brandText,'--cta':mint,'--cta-ink':dark?'#05251a':'#082a21','--muted-bg':dark?'#17231d':'#edf3ef','--subtle':dark?'#17231d':'#edf3ef','--bg':dark?'#09100d':'#f7f9f8','--card':dark?'#101815':'#ffffff','--border':dark?'#26362e':'#e2e8e5','--text':dark?'#ecf3ef':'#0c1a15','--muted':dark?'#93a79d':'#52645b','--amber':dark?'#fbbf24':'#a16207','--amber-bg':dark?'#3e2e0c':'#fef3c7','--red':dark?'#f87171':'#b91c1c','--red-bg':dark?'#421b1b':'#fee2e2','--shadow':dark?'0 12px 36px rgba(0,0,0,.35)':'0 12px 36px rgba(12,26,21,.12)'};for(const [k,v] of Object.entries(vars))root.style.setProperty(k,v);root.style.colorScheme=dark?'dark':'light'}

function nutritionEstimate(r){const text=(r.ingredients||[]).map(i=>i.name+' '+i.qty+' '+i.unit).join(' ').toLowerCase();let kcal=360,protein=18,carbs=42,fat=11,fibre=5,sodium=650,sugar=5;const add=(re,k,p,c,f,fi,na,su)=>{if(re.test(text)){kcal+=k;protein+=p;carbs+=c;fat+=f;fibre+=fi;sodium+=na;sugar+=su}};add(/chicken|beef|fish|prawn|shrimp/,80,17,0,3,0,60,0);add(/tofu|tempeh/,20,5,1,2,1,15,0);add(/egg/,65,6,0,5,0,65,0);add(/rice|noodle|pasta/,130,3,27,1,1,80,1);add(/vegetable|spinach|broccoli|cabbage|tomato|mushroom|carrot/,25,1,4,0,2,25,2);add(/coconut milk|cream|cheese/,100,2,3,9,0,80,2);return {kcal:Math.max(100,Math.round(kcal)),protein:Math.max(1,Math.round(protein)),carbs:Math.max(1,Math.round(carbs)),fat:Math.max(1,Math.round(fat)),fibre:Math.max(0,Math.round(fibre)),sodium:Math.max(50,Math.round(sodium)),sugar:Math.max(0,Math.round(sugar))}}
function nutritionHtml(r){const n=r.nutrition||nutritionEstimate(r);return `<details class="nutrition"><summary>🥗 Estimated nutrition per serving</summary><div class="nutrition-grid"><div><strong>${n.kcal}</strong><span>kcal</span></div><div><strong>${n.protein}g</strong><span>Protein</span></div><div><strong>${n.carbs}g</strong><span>Carbs</span></div><div><strong>${n.fat}g</strong><span>Fat</span></div><div><strong>${n.fibre}g</strong><span>Fibre</span></div><div><strong>${n.sodium}mg</strong><span>Sodium</span></div><div><strong>${n.sugar}g</strong><span>Sugars</span></div></div><p class="hint">Rough estimate only; portion sizes, brands and seasoning change nutrition substantially. Check packaging and seek clinical advice for medical diets.</p></details>`}
function recipeCard(r){const gaps=needIngredients(r),have=pantryText(r).filter(i=>itemFor(i.name)),total=gaps.reduce((s,i)=>s+estimatePrice(i.name,STORE_FACTORS[state.route.supermarket]),0),expanded=!!state.recipeExpanded[r.name];return `<article class="card recipe-card"><div class="recipe-card-head"><span class="food-emoji">${esc(r.emoji)}</span><div class="grow"><h3 class="recipe-name">${esc(r.name)}</h3><p class="recipe-summary">${esc(r.summary)}</p><div class="pillrow" style="margin-top:8px"><span class="badge">⏱ ${Math.max(5,Math.ceil(Number(r.minutes||10)/5)*5)} min cook</span><span class="badge">${r.kidFriendly?'🧒 Kid-friendly':'🌶️ Bold flavour'}</span><span class="badge">${esc(r.source||'Forkcast kitchen')}</span></div></div></div>${nutritionHtml(r)}${healthReviewHtml(r)}<div class="row between" style="margin-top:12px"><span class="secondary">Spice <span class="spicedots">${'●'.repeat(r.spice)}${'○'.repeat(3-r.spice)}</span></span><span class="secondary">${Math.round(shareInFridge(r)*100)}% in your fridge</span></div><div class="taglist">${have.length?have.map(i=>`<span class="tag have">✓ ${esc(i.name)}</span>`).join(''):'<span class="tag">No ingredients matched yet</span>'}${gaps.length?gaps.slice(0,5).map(i=>`<span class="tag need">＋ ${esc(i.name)}</span>`).join('')+(gaps.length>5?`<span class="tag need">+${gaps.length-5} more</span>`:''):'<span class="tag have">✓ You have everything</span>'}</div><div class="row between" style="margin-top:12px"><div><div class="smallmuted">Estimated missing groceries</div><div class="price">${money(total)}</div></div><div class="row wrap" style="justify-content:flex-end"><button class="btn small" data-action="take-ingredients" data-recipe="${esc(r.name)}">🥬 Take from fridge</button><button class="btn primary small" data-action="cook" data-recipe="${esc(r.name)}">Get ingredients →</button></div></div><details class="method" ${expanded?'open':''}><summary data-action="recipe-method" data-recipe="${esc(r.name)}">Ingredients function onboardingHtml(){if(!state.onboardingOpen)return '';const step=state.onboardingStep||0,p=state.preferences,line=routeLine();let body='';if(step===0){const options=[['Single commuter','🍱','Quick, efficient solo meals'],['Couple','🍽️','Two-serving dinners'],['Family with kids','👨‍👩‍👧','Family portions and kid-friendly ideas'],['Roommates','🏠','Flexible shared groceries']];body=options.map(([name,icon,note])=>`<button class="household-option" data-action="household" data-household="${esc(name)}" aria-pressed="${p.household===name}"><span class="food-emoji">${icon}</span><span class="grow"><strong style="display:block">${esc(name)}</strong><span class="secondary">${esc(note)}</span></span><span>${p.household===name?'✓':'○'}</span></button>`).join('')+`<div class="checkrow"><input type="checkbox" id="kid-onboard" data-pref="kidFriendly" ${p.kidFriendly?'checked':''}><label for="kid-onboard">Kid-friendly / mild recipes</label></div>`}else if(step===1){body=Object.entries(TASTE_NAMES).map(([k,n])=>tasteRow(k,n)).join('')}else if(step===2){body=Object.entries(DIET_NAMES).map(([k,n])=>`<div class="checkrow"><input type="checkbox" id="onboard-diet-${k}" data-diet="${k}" ${p.diets[k]?'checked':''}><label for="onboard-diet-${k}">${esc(n)}${k==='halal'?'<span class="hint" style="display:block">Filters pork and alcohol; not certification.</span>':''}</label></div>`).join('')+`<div class="field" style="margin-top:12px"><label for="onboard-allergies">Other allergies / ingredients to avoid</label><textarea class="textarea" id="onboard-allergies" data-diet="otherAllergies" maxlength="400" placeholder="e.g. sesame, kiwi">${esc(p.diets.otherAllergies)}</textarea></div>`}else{body=routeEditorHtml(true)}return `<div class="modal-backdrop" role="presentation"><section class="modal" role="dialog" aria-modal="true" aria-labelledby="onboard-title"><div class="row between"><span class="badge brand">STEP ${step+1} OF 4</span><button class="iconbtn" aria-label="Skip setup" data-action="onboarding-skip">×</button></div><div class="progress">${[0,1,2,3].map(i=>`<span class="${i<=step?'done':''}"></span>`).join('')}</div><h2 id="onboard-title" class="section-title" style="font-size:25px">${['Who are we cooking for?','What tastes right to you?','Any dietary guardrails?','Your commute'][step]}</h2><p class="secondary" style="margin:6px 0 18px">${['Start with your household. You can change this any time.','Tune your preferences from off to max.','These are keyword filters, so always double-check packaging.','Choose a line, station and your usual supermarket.'][step]}</p>${body}<div class="row between" style="margin-top:22px;padding-top:14px;border-top:1px solid var(--border)"><button class="btn ghost" data-action="onboarding-skip">Skip</button><div class="row"><button class="btn" data-action="onboarding-back" ${step===0?'disabled':''}>Back</button><button class="btn primary" data-action="onboarding-next">${step===3?'Finish':'Continue'} →</button></div></div></section></div>`}

function pushGap(name,recipeName){if(!name||isPantryBasic(name))return false;if(state.gaps.some(g=>namesMatch(g.name,name)))return false;state.gaps.push({id:'gap-'+Date.now()+'-'+Math.random().toString(36).slice(2,6),name,qty:1,unit:'pack',emoji:emojiFor(name),recipeName:recipeName||'Manual add'});return true}

function onChangeRouteLine(value){if(!DATA.lines[value])return;state.route.line=value;if(!DATA.lines[value].stations.includes(state.route.station))state.route.station=DATA.lines[value].stations[0];persistRender()}
function updateTaste(key,value){if(!(key in TASTE_NAMES))return;state.preferences.taste[key]=Math.max(0,Math.min(4,Number(value)||0));persistRender()}
function updateDiet(key,value){if(key==='otherAllergies'){state.preferences.diets.otherAllergies=String(value).slice(0,400)}else if(key in DIET_NAMES){state.preferences.diets[key]=!!value;if(key==='vegan'&&value)state.preferences.diets.vegetarian=true;if(key==='vegetarian'&&!value&&state.preferences.diets.vegan)state.preferences.diets.vegan=false}persistRender()}
function takeRecipeIngredients(name){const r=[...(state.generatedRecipes||[]),...DATA.recipes].find(x=>x.name===name);if(!r)return;let changed=0;for(const ing of pantryText(r)){const item=itemFor(ing.name);if(!item)continue;const qty=Number(item.qty)||1,step=/^(g|ml)$/i.test(item.unit)?100:1;item.qty=Math.max(0,Math.round((qty-step)*100)/100);changed++;recordSensorEvent('out',item.name,step,item.unit,'Taken to prepare '+name);if(item.qty<=0)state.items=state.items.filter(x=>x.id!==item.id)}state.sensor=state.sensor||{};state.sensor.connected=false;state.sensor.lastEvent='Ingredients taken for '+name;saveState();render();showToast(changed?changed+' fridge item(s) updated for '+name+'.':'No matching ingredients were in the fridge.');}
function useCurrentLocation(){const status=document.getElementById('location-status');if(!navigator.geolocation){if(status)status.textContent='Location is not supported by this browser. Enter an address instead.';return}if(status)status.textContent='Requesting location permission…';navigator.geolocation.getCurrentPosition(pos=>{state.route.lat=pos.coords.latitude;state.route.lng=pos.coords.longitude;state.route.locationLabel='Current location saved';state.route.address='';saveState();render();showToast('Location saved for this browser session.')},err=>{if(status)status.textContent=err.code===1?'Location permission denied. Enter an address instead.':'Could not get location. Enter an address instead.'},{enableHighAccuracy:false,timeout:10000,maximumAge:300000})}

function cookRecipe(name){const r=[...(state.generatedRecipes||[]),...DATA.recipes].find(r=>r.name===name);if(!r)return;const missing=needIngredients(r);let added=0;missing.forEach(i=>{if(pushGap(i.name,r.name))added++});saveState();if(added===0)showToast('Your Gaps list already covers this recipe.');else showToast(added+' missing ingredient'+(added===1?'':'s')+' added to Gaps.');state.activeTab='gaps';state.alertsOpen=false;render();window.scrollTo({top:0,behavior:'auto'})}

async function resizeScanImage(file,maxSide){const source=URL.createObjectURL(file);try{const img=await dataUrlToImage(source);const scale=Math.min(1,maxSide/Math.max(img.naturalWidth||img.width,img.naturalHeight||img.height));const canvas=document.createElement('canvas');canvas.width=Math.max(1,Math.round((img.naturalWidth||img.width)*scale));canvas.height=Math.max(1,Math.round((img.naturalHeight||img.height)*scale));const ctx=canvas.getContext('2d',{alpha:false});ctx.drawImage(img,0,0,canvas.width,canvas.height);return canvas.toDataURL('image/jpeg',.86)}finally{URL.revokeObjectURL(source)}}

let transformersModulePromise=null, objectDetectorPromise=null, dishClassifierPromise=null, textGeneratorPromise=null, activeTesseractWorker=null, scanJobId=0, aiRecipeJobId=0;
function updateScanProgress(message,progress){if(state.scan){state.scan.status=String(message||'Working…').slice(0,160);if(Number.isFinite(progress))state.scan.progress=Math.max(0,Math.min(100,progress));}const t=document.getElementById('scan-status'),p=document.getElementById('scan-progress');if(t)t.textContent=state.scan?.status||message||'Working…';if(p&&Number.isFinite(progress))p.value=Math.max(0,Math.min(100,progress));}
async function loadTransformers(){if(!transformersModulePromise)transformersModulePromise=import('https://cdn.jsdelivr.net/npm/@huggingface/transformers@4.3.1').catch(e=>{transformersModulePromise=null;throw new Error('Could not load the browser AI library. Check your internet connection and retry. ('+String(e?.message||e).slice(0,90)+')')});return transformersModulePromise}
async function getObjectDetector(){if(!objectDetectorPromise){objectDetectorPromise=(async()=>{const {pipeline}=await loadTransformers();return await pipeline('object-detection','Xenova/yolos-tiny',{dtype:'q4',progress_callback:p=>{if(p?.status==='progress')updateScanProgress('Downloading local food detector… '+Math.round(p.progress||0)+'%',p.progress||0);else if(p?.status)updateScanProgress('Loading local food detector…',p.progress||0)}})})().catch(e=>{objectDetectorPromise=null;throw e})}return objectDetectorPromise}
async function getDishClassifier(){if(!dishClassifierPromise){dishClassifierPromise=(async()=>{const {pipeline}=await loadTransformers();return await pipeline('image-classification','onnx-community/swin-finetuned-food101-ONNX',{dtype:'q4',progress_callback:p=>{if(p?.status==='progress')updateScanProgress('Downloading optional food classifier… '+Math.round(p.progress||0)+'%',p.progress||0);else if(p?.status)updateScanProgress('Loading food classifier…',p.progress||0)}})})().catch(e=>{dishClassifierPromise=null;throw e})}return dishClassifierPromise}
async function getTextGenerator(){if(!textGeneratorPromise){textGeneratorPromise=(async()=>{const {pipeline}=await loadTransformers();return await pipeline('text-generation','onnx-community/SmolLM2-360M-Instruct-ONNX',{dtype:'q4',progress_callback:p=>{if(p?.status==='progress')updateRecipeAIStatus('Downloading local language model… '+Math.round(p.progress||0)+'%',p.progress||0);else if(p?.status)updateRecipeAIStatus('Loading local language model…',p.progress||0)}})})().catch(e=>{textGeneratorPromise=null;throw e})}return textGeneratorPromise}
function updateRecipeAIStatus(message,progress){const t=document.getElementById('recipe-ai-status'),p=document.getElementById('recipe-ai-progress');if(t)t.textContent=String(message||'').slice(0,200);if(p&&Number.isFinite(progress))p.value=Math.max(0,Math.min(100,progress));}
function dataUrlToImage(dataUrl){return new Promise((resolve,reject)=>{const img=new Image();img.onload=()=>resolve(img);img.onerror=()=>reject(new Error('The selected image could not be decoded. Try a JPG or PNG photo.'));img.src=dataUrl})}
async function loadExternalScript(src,globalName){if(window[globalName])return window[globalName];await new Promise((resolve,reject)=>{const old=document.querySelector(`script[data-forkcast-src="${src}"]`);if(old){old.addEventListener('load',resolve,{once:true});old.addEventListener('error',reject,{once:true});if(window[globalName])resolve();return}const script=document.createElement('script');script.src=src;script.async=true;script.dataset.forkcastSrc=src;script.onload=resolve;script.onerror=()=>reject(new Error('Could not load the OCR library. Check your connection and try again.'));document.head.appendChild(script)});if(!window[globalName])throw new Error('The OCR library did not initialise. Please reload and try again.');return window[globalName]}
function foodDisplayName(label){const map={apple:'Apples',banana:'Bananas',orange:'Oranges',broccoli:'Broccoli',carrot:'Carrots',pizza:'Pizza',sandwich:'Sandwiches','hot dog':'Hot dogs',cake:'Cake',donut:'Donuts','dining table':'',bowl:'',cup:'',bottle:'',person:''};return map[String(label||'').toLowerCase()]||''}
async function runSmartScan(){const scan=state.scan||{};if(!scan.fileData){showToast('Choose or take a photo first.');return}const job=++scanJobId;state.scan.busy=true;state.scan.error='';state.scan.label='';state.scan.rows=[];state.scan.status='Preparing image…';state.scan.progress=0;persistRender();try{let rows=[],label='';if(scan.mode==='receipt'){updateScanProgress('Loading receipt OCR…',3);const Tesseract=await loadExternalScript('https://cdn.jsdelivr.net/npm/tesseract.js@5/dist/tesseract.min.js','Tesseract');if(job!==scanJobId)return;const worker=await Tesseract.createWorker('eng',1,{logger:m=>{if(job!==scanJobId)return;if(m.status==='recognizing text')updateScanProgress('Reading receipt text…',Math.round((m.progress||0)*100));else updateScanProgress(m.status||'Preparing receipt OCR…',Math.round((m.progress||0)*100))}});activeTesseractWorker=worker;try{const result=await worker.recognize(scan.fileData);if(job!==scanJobId)return;const parsed=parseReceiptText(result?.data?.text||'');rows=parsed.items;state.scan.store=parsed.store||'Unknown supermarket';label='Receipt text read in your browser · '+state.scan.store;if(!rows.length)throw new Error('The receipt image was opened, but no grocery lines could be read confidently. Try a sharper, straight-on photo with better lighting, or add items manually.')}finally{if(activeTesseractWorker===worker)activeTesseractWorker=null;try{await worker.terminate()}catch(_){}}}else{updateScanProgress('Loading lightweight object detector (first use downloads about 8 MB)…',2);const detector=await getObjectDetector();if(job!==scanJobId)return;updateScanProgress('Finding visible objects…',10);const img=await dataUrlToImage(scan.fileData);const detections=await detector(img,{threshold:0.18});if(job!==scanJobId)return;const counts=new Map();for(const d of (Array.isArray(detections)?detections:[])){const name=foodDisplayName(d.label);if(!name||Number(d.score||0)<0.18)continue;const key=name.toLowerCase();const entry=counts.get(key)||{name,qty:0,unit:'pcs',emoji:emojiFor(name),selected:true,score:0};entry.qty++;entry.score=Math.max(entry.score,Number(d.score)||0);counts.set(key,entry)}rows=Array.from(counts.values()).slice(0,10);if(rows.length){label='On-device object detection · '+rows.length+' food object type'+(rows.length===1?'':'s')+' suggested';}else{updateScanProgress('No common grocery objects found. Trying prepared-dish recognition…',15);const classifier=await getDishClassifier();if(job!==scanJobId)return;const predictions=await classifier(img);if(job!==scanJobId)return;const guess=Array.isArray(predictions)&&predictions[0]?String(predictions[0].label||'').replace(/_/g,' ').replace(/\s+/g,' ').trim():'';if(!guess)throw new Error('No recognisable food objects were found. Try a closer photo with common fruit/vegetables visible, or use Quick add.');const tokens=guess.toLowerCase().split(/[^a-z0-9]+/).filter(x=>x.length>2);const ranked=DATA.recipes.map(r=>({r,score:tokens.reduce((n,t)=>n+((r.name+' '+r.summary+' '+r.ingredients.map(i=>i.name).join(' ')).toLowerCase().includes(t)?1:0),0)})).sort((a,b)=>b.score-a.score);const candidate=ranked[0]?.r;if(!candidate||!ranked[0].score)throw new Error('The photo may show '+guess+', but Forkcast could not link it to a likely ingredient list. Use Quick add for the actual groceries.');rows=candidate.ingredients.filter(i=>!isPantryBasic(i.name)).map(i=>({name:i.name,qty:Number(i.qty)||1,unit:i.unit||'pcs',emoji:emojiFor(i.name),selected:false}));label='Dish guess: “'+guess+'” · unticked ingredients are suggestions from “'+candidate.name+'”, not items individually detected';}}
if(job!==scanJobId)return;state.scan.rows=rows.map(r=>({...r,name:String(r.name||'').slice(0,80),qty:Math.max(.01,Math.min(99999,Number(r.qty)||1)),unit:String(r.unit||'pcs').slice(0,12),emoji:r.emoji||emojiFor(r.name),selected:!!r.selected}));state.scan.label=label;state.scan.busy=false;state.scan.status='';state.scan.progress=100;state.scan.error='';persistRender();showToast(rows.length+' review suggestion'+(rows.length===1?'':'s')+' ready. Check before adding.')}catch(e){if(job!==scanJobId)return;state.scan.busy=false;state.scan.status='';state.scan.error=String(e?.message||'Local scan failed. Try another image or quick add.').slice(0,350);persistRender()} }
function parseReceiptText(text){const lines=String(text||'').split(/\r?\n/).map(s=>s.replace(/[|]/g,' ').replace(/\s+/g,' ').trim()).filter(Boolean);const upper=lines.join(' ').toLowerCase();let store='Unknown supermarket';if(/fairprice|ntuc|finest/i.test(upper))store='FairPrice';else if(/sheng\s*siong/i.test(upper))store='Sheng Siong';else if(/cold\s*storage/i.test(upper))store='Cold Storage';else if(/\bprime\s+(supermarket|market)/i.test(upper))store='Prime';const ignored=/^(sub\s*total|grand\s*total|total\b|amount\s*due|gst\b|tax\b|discount\b|promo(tion)?\b|member(ship)?\b|thank\s*you|receipt\b|cashier\b|rounding\b|savings\b|bag\s*(charge|fee)?\b|plastic\s*bag\b|deposit\b|refund\b|balance\b|payment\b|txn\b|transaction\b|date\b|time\b|invoice\b|loyalty\b|points\b|change\b|cash\b|visa\b|mastercard\b|nets\b|u\s*save\b|subtotal\b)/i;const grocery=/milk|egg|banana|apple|orange|broccoli|carrot|chicken|beef|pork|fish|prawn|shrimp|tofu|tomato|rice|noodle|pasta|bread|oil|salt|pepper|sugar|soy|onion|garlic|spinach|cabbage|mushroom|potato|yogurt|yoghurt|cheese|butter|cream|flour|cucumber|corn|coconut|ginger|lemon|lentil|chickpea|bean|tempeh|salmon|tuna|fishball|bok choy|pak choi|bee hoon|oat|cereal|coffee|tea|water|juice|fruit|vegetable|vege|biscuit|cracker|snack|frozen|dumpling|sausage|ham|bacon|curry|sauce|miso|ketchup|mayonnaise|mayo|sardine|tuna/i;const abbreviations=[[/\bFP\s+LF\s+MILK\b|\bLF\s+MILK\b/i,'Low fat milk'],[/\bCHKN\s+BRST\b|\bCHICKEN\s+BRST\b/i,'Chicken breast'],[/\bCHKN\b/i,'Chicken'],[/\bEGGS?\s+(?:GRADE\s+[A-Z]\s+)?(?:6S|10S|12S|15S|6|10|12|15)\b/i,'Eggs'],[/\bBRWN\s+RICE\b/i,'Brown rice'],[/\bBEE\s*HOON\b/i,'Bee hoon'],[/\bBOK\s*CHOY\b/i,'Bok choy'],[/\bSHENG\s*SIONG\b/i,''],[/\bFP\s+(?=[A-Z])/i,'']];const items=[];const seen=new Set();for(let raw of lines){if(raw.length<4||raw.length>150||ignored.test(raw)||/^[-=*_. ]+$/.test(raw))continue;const hadPrice=/(?:\$\s*)?\d{1,4}[.,]\d{2}\s*$/.test(raw);let line=raw.replace(/\s+(?:\$\s*)?\d{1,4}[.,]\d{2}\s*$/,'').trim();line=line.replace(/^\d{4,}\s+/,'').replace(/^\d+\s*[x×]\s*/i,'');if(!line||!/[a-z]{2,}/i.test(line))continue;if(!hadPrice&&!grocery.test(line))continue;if(ignored.test(line)||/\b(subtotal|grand total|total amount|gst|discount|promotion|cashier|membership|loyalty|points|receipt|transaction|change due|payment)\b/i.test(line))continue;let quantity=1,unit='pack';const quantityMatch=line.match(/\b(\d+(?:[.,]\d+)?)\s*(kg|g|ml|l|litre|liter)\b/i);if(quantityMatch){quantity=Number(quantityMatch[1].replace(',','.'));unit=/^kg$/i.test(quantityMatch[2])?'kg':/^g$/i.test(quantityMatch[2])?'g':/^ml$/i.test(quantityMatch[2])?'ml':'L';line=line.replace(quantityMatch[0],' ').trim()}line=line.replace(/\b(?:10S|12S|15S|6S|10|12|15)\s*$/i,'').trim();for(const [re,value] of abbreviations)line=line.replace(re,value);line=line.replace(/\b(?:1PC|2PC|4PCS|6PCS|PACK|PK)\b/ig,' ').replace(/\b[A-Z0-9]{6,}\b/g,' ').replace(/[^a-zA-Z0-9 &'/-]/g,' ').replace(/\s+/g,' ').trim();line=line.replace(/\bfp\b/i,'').trim();if(line.length<3||line.length>70)continue;let name=line.toLowerCase().replace(/\b[a-z]/g,c=>c.toUpperCase());name=name.replace(/\bLf\b/g,'low fat').replace(/\bOf\b/g,'of');if(!grocery.test(name)&&!hadPrice)continue;const key=name.toLowerCase().replace(/[^a-z0-9]/g,'');if(seen.has(key))continue;seen.add(key);items.push({name,qty:Math.max(.01,Math.min(99999,quantity)),unit,emoji:emojiFor(name),selected:true});if(items.length>=30)break;}return {store,items}}

function cleanGeneratedRecipes(raw){let value=String(raw||'');const a=value.indexOf('['),b=value.lastIndexOf(']');if(a<0||b<=a)return [];let parsed;try{parsed=JSON.parse(value.slice(a,b+1))}catch(_){return []}if(!Array.isArray(parsed))return [];const out=[];for(const r of parsed.slice(0,6)){if(!r||typeof r.name!=='string'||!r.name.trim()||r.name.length>80||!Array.isArray(r.ingredients)||!Array.isArray(r.steps))continue;const minutes=Math.round(Number(r.minutes));const spice=Math.round(Number(r.spice));if(!Number.isFinite(minutes)||minutes<5||minutes>30||!Number.isFinite(spice)||spice<0||spice>3||r.ingredients.length<3||r.ingredients.length>14||r.steps.length<3||r.steps.length>5)continue;const ingredients=r.ingredients.filter(i=>i&&typeof i.name==='string'&&i.name.trim().length<=80&&!/^(oil|salt|pepper|sugar|soy sauce)$/i.test(i.name.trim())).slice(0,12).map(i=>({name:i.name.trim(),qty:Math.max(.1,Math.min(9999,Number(i.qty)||1)),unit:String(i.unit||'pcs').slice(0,12)}));if(ingredients.length<3)continue;const steps=r.steps.filter(x=>typeof x==='string'&&x.trim()).slice(0,5).map(x=>x.trim().slice(0,220));if(steps.length<3)continue;const recipe={name:r.name.trim(),emoji:/^[\p{Extended_Pictographic}]/u.test(String(r.emoji||''))?String(r.emoji).slice(0,8):emojiFor(r.name),minutes,spice,kidFriendly:!!r.kidFriendly,summary:String(r.summary||'A simple, home-style meal.').slice(0,220),category:'Local AI',source:'Local open model',ingredients,steps};if(dietsAllow(recipe))out.push(recipe)}return out.slice(0,3)}
async function generateLocalRecipes(){const job=++aiRecipeJobId;const buttonEl=document.querySelector('[data-action="generate-local-recipes"]');if(buttonEl)buttonEl.disabled=true;updateRecipeAIStatus('Starting local model. The first use downloads about 386 MB; later uses may be cached.',0);try{const generator=await getTextGenerator();if(job!==aiRecipeJobId)return;updateRecipeAIStatus('Asking the local model for three '+mealLabel().toLowerCase()+' ideas…',0);const available=state.items.map(i=>`${i.name} (${i.qty} ${i.unit}, added ${ageLabel(i.addedAt)})`).slice(0,40).join(', ')||'No ingredients recorded';const diet=Object.entries(state.preferences.diets).filter(([k,v])=>k!=='otherAllergies'&&v).map(([k])=>DIET_NAMES[k]).join(', ')||'No selected dietary restrictions';const request=String(state.recipeAsk||'Quick practical '+mealLabel().toLowerCase()).slice(0,160);const userPrompt=`You are Forkcast, a careful Singapore home-cooking recipe planner. Create exactly 3 different ${mealLabel().toLowerCase()} ideas using ingredients commonly available at FairPrice, Sheng Siong, Prime or Cold Storage. Each under 30 minutes. Avoid oil, salt, pepper, sugar and soy sauce in ingredient lists because pantry basics are assumed. Respect these preferences: household=${state.preferences.household}; kid-friendly=${state.preferences.kidFriendly}; taste dials=${JSON.stringify(state.preferences.taste)}; diet=${diet}; other allergies to avoid=${String(state.preferences.diets.otherAllergies||'none').slice(0,250)}; user request=${request}; fridge=${available}. Return only a valid JSON array, no markdown, with each item fields: name (string), emoji (one emoji), minutes (integer 5-30), spice (integer 0-3), kidFriendly (boolean), summary (one short sentence), ingredients (array of 4-9 objects with name, qty (number), unit (string)), steps (array of 3-5 short strings). Use familiar Singapore ingredients and practical cooking methods. Never claim certification. Ensure every recipe follows the diet and allergy restrictions.`;const prompt=`<|im_start|>system\nYou are a helpful recipe generator. Follow the requested JSON schema exactly. Keep answers simple and realistic. Do not include markdown fences.\n<|im_end|>\n<|im_start|>user\n${userPrompt}\n<|im_end|>\n<|im_start|>assistant\n`;const output=await generator(prompt,{max_new_tokens:1050,temperature:0.45,do_sample:true,return_full_text:true});if(job!==aiRecipeJobId)return;const raw=output?.[0]?.generated_text||'';const recipes=cleanGeneratedRecipes(raw);if(recipes.length<2){state.generatedRecipes=[];state.recipeAsk='';state.recipeFilter='All';state.recipeLimit=3;saveState();updateRecipeAIStatus('The small local model returned an invalid or unsafe recipe format. Showing the best built-in recipes instead.');persistRender();showToast('Local model output could not be validated. Showing built-in picks.');return}state.generatedRecipes=recipes;state.recipeAsk='';state.recipeFilter='All';state.recipeLimit=Math.max(4,recipes.length);state.activeTab='dinners';saveState();render();updateRecipeAIStatus('Generated '+recipes.length+' recipes locally. Review ingredients and allergy safety before cooking.');showToast('Local AI recipes are ready.')}catch(e){if(job!==aiRecipeJobId)return;updateRecipeAIStatus('Local AI could not start: '+String(e?.message||e).slice(0,150)+'. Built-in recipes still work without the model.');showToast('Local AI is unavailable. Built-in dinner ideas remain ready.')}finally{const b=document.querySelector('[data-action="generate-local-recipes"]');if(b)b.disabled=false}}
function handleClick(e){const b=e.target.closest('[data-action]');if(!b)return;const action=b.dataset.action;switch(action){case'tab':case'alert-tab':setTab(b.dataset.tab);return;case'alerts':state.alertsOpen=!state.alertsOpen;persistRender();return;case'appearance-avatar':state.profile.avatar=b.dataset.avatar||'🍳';persistRender();return;case'appearance-theme':state.profile.themeColor=b.dataset.theme||'teal';persistRender();return;case'meal-choice':state.mealChoice=b.dataset.meal||'auto';state.recipeLimit=4;persistRender();return;case'onboarding-open':openOnboarding();return;case'onboarding-skip':finishOnboarding();return;case'onboarding-back':state.onboardingStep=Math.max(0,(state.onboardingStep||0)-1);persistRender();return;case'onboarding-next':if(state.onboardingStep>=3)finishOnboarding();else{state.onboardingStep++;persistRender()}return;case'household':state.preferences.household=b.dataset.household;if(b.dataset.household==='Family with kids')state.preferences.kidFriendly=true;persistRender();return;case'scan-mode':reviewInit(b.dataset.mode);return;case'identify':runSmartScan();return;case'stop-scan':cancelScan();return;case'sample-scan':loadDemoScan();return;case'clear-scan':scanJobId++;if(activeTesseractWorker){try{activeTesseractWorker.terminate()}catch(_){ }activeTesseractWorker=null}state.scan={mode:state.scan?.mode||'food',label:'',rows:[],fileData:'',fileName:'',busy:false,error:'',status:'',progress:0};persistRender();return;case'generate-local-recipes':generateLocalRecipes();return;case'add-scan':{const rows=state.scan?.rows||[];const selected=rows.filter(r=>r.selected&&r.name.trim());if(!selected.length){showToast('Select at least one item to add.');return}selected.forEach(r=>addFood(r.name,Number(r.qty)||1,r.unit||'pcs',r.emoji||emojiFor(r.name)));state.scan.label='';state.scan.rows=[];state.scan.fileData='';state.activeTab='fridge';persistRender();showToast(selected.length+' reviewed item'+(selected.length===1?'':'s')+' added to fridge.');return}case'use-item':{const i=state.items.find(i=>i.id===b.dataset.id);if(!i)return;const step=/^(g|ml)$/i.test(i.unit)?100:1;recordSensorEvent('out',i.name,step,i.unit,'Manual use-up');i.qty=Math.max(0,Math.round((i.qty-step)*100)/100);if(i.qty<=0){state.items=state.items.filter(x=>x.id!==i.id);showToast(i.name+' finished and removed.')}else showToast('Used up some '+i.name+'.');persistRender();return}case'remove-item':{const i=state.items.find(i=>i.id===b.dataset.id);if(i)recordSensorEvent('out',i.name,i.qty,i.unit,'Removed manually');state.items=state.items.filter(i=>i.id!==b.dataset.id);persistRender();showToast('Item removed from fridge.');return;}case'sync-receipts':{const sample=[['Low fat milk',1,'L'],['Bananas',5,'pcs'],['Brown rice',1,'pack'],['Mushrooms',1,'pack']];sample.forEach(x=>addFood(x[0],x[1],x[2]));saveState();render();showToast('Sample FairPrice basket synced (demo).');return}case'clear-examples':{const before=state.items.length;state.items=state.items.filter(i=>!i.example);persistRender();showToast((before-state.items.length)+' example items cleared.');return}case'recipe-filter':state.recipeFilter=b.dataset.filter;state.recipeLimit=4;persistRender();return;case'prompt':{state.recipeAsk=PROMPTS[Number(b.dataset.index)]||'';state.recipeFilter='All';state.recipeLimit=4;persistRender();return}case'show-more':state.recipeLimit=(state.recipeLimit||4)+4;persistRender();return;case'reset-recipe-filters':state.recipeAsk='';state.recipeFilter='All';state.recipeLimit=4;persistRender();return;case'clear-ask':state.recipeAsk='';state.recipeLimit=4;persistRender();return;case'cook':cookRecipe(b.dataset.recipe);return;case'take-ingredients':takeRecipeIngredients(b.dataset.recipe);return;case'sensor-refresh':state.sensor=state.sensor||{};state.sensor.connected=false;state.sensor.lastSeen=new Date().toLocaleString();state.sensor.source='simulated';state.sensor.temp=Number((3.5+Math.random()*.5).toFixed(1));state.sensor.door='Closed';persistRender();showToast('Demo sensor refreshed. No physical sensor feed is connected.');return;case'sensor-connect':showToast('To connect real hardware, configure a sensor endpoint/API integration. GitHub Pages alone cannot access a private sensor network.');return;case'use-location':useCurrentLocation();return;case'save-location':saveAddressLocation();return;case'remove-gap':state.gaps=state.gaps.filter(g=>g.id!==b.dataset.id);persistRender();showToast('Removed from Gaps list.');return;case'buy-gap':{const g=state.gaps.find(g=>g.id===b.dataset.id);if(!g)return;addFood(g.name,g.qty||1,g.unit||'pack',g.emoji);state.gaps=state.gaps.filter(x=>x.id!==g.id);persistRender();showToast(g.name+' moved to your fridge.');return}case'mark-purchased':{const all=state.gaps.slice();if(!all.length)return;all.forEach(g=>addFood(g.name,g.qty||1,g.unit||'pack',g.emoji));state.gaps=[];persistRender();showToast('All groceries moved to your fridge.');return}default:return}}

 if(t.dataset.profile){let k=t.dataset.profile,v=t.value;if(['height','weight','age'].includes(k)){const n=Number(v);if(!Number.isFinite(n)||n<=0){showToast('Enter a positive number.');return}v=n}if(k==='healthConditions')v=String(v).slice(0,500);if(k==='activity')v=Number(v);if(k==='goal')v=Number(v);state.profile[k]=v;persistRender();return}

 if(t.dataset.action==='review-name'||t.dataset.action==='review-qty'||t.dataset.action==='review-unit'){const r=state.scan?.rows?.[Number(t.dataset.index)];if(!r)return;if(t.dataset.action==='review-name')r.name=t.value.slice(0,80);if(t.dataset.action==='review-qty')r.qty=Math.max(.01,Math.min(99999,Number(t.value)||1));if(t.dataset.action==='review-unit')r.unit=t.value.slice(0,12);saveState();return}
});
